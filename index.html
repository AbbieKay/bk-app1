<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournament</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8">

  <div id="modeBadge" class="mode-badge bg-gray-800 text-gray-300 border border-gray-700 no-print">
    <span class="live-dot"></span><span id="modeLabel">Viewer Mode</span>
  </div>

  <div class="max-w-7xl mx-auto">

    <header class="mb-8">
      <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
        <div>
          <p class="text-sm uppercase tracking-widest text-blue-400 font-semibold">Live Tournament</p>
          <h1 id="tournamentTitle" class="mt-2 text-3xl md:text-5xl font-black text-white">Loading...</h1>
          <p class="text-gray-400 mt-3">Real-time scores and fixtures</p>
        </div>

        <div class="no-print flex flex-wrap gap-2">
          <button id="dashboardBtn" onclick="showDashboard()" class="hidden bg-gray-800 hover:bg-gray-700 border border-gray-700 px-4 py-2 rounded-lg text-sm">← Dashboard</button>
          <button onclick="copyFixtures()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-4 py-2 rounded-lg text-sm">Copy</button>
          <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-4 py-2 rounded-lg text-sm">Print</button>
          <button id="adminToggleBtn" onclick="toggleAdminMode()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold">Admin Login</button>
          <button id="shareBtn" onclick="shareLink()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-semibold">Share Link</button>
        </div>
      </div>
    </header>

    <div id="dashboardView">
      <div id="dashboardContent"></div>
    </div>

    <div id="gameDetailView" class="hidden">
      <div id="adminPanel" class="hidden">
        <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">

          <aside class="xl:col-span-1 space-y-6">

            <section class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-green-400">Organisations</h2>
                <span class="text-xs bg-gray-800 px-2 py-1 rounded-full"><span id="organisationCount">0</span></span>
              </div>

              <label class="text-sm text-gray-400">Tournament Name</label>
              <input id="tournamentNameInput" type="text" oninput="updateTournamentName(this.value)"
                class="w-full mt-1 mb-3 bg-gray-800 border border-gray-700 rounded-lg p-2 focus:outline-none focus:border-blue-500" />

              <label class="text-sm text-gray-400">Admin Code</label>
              <input id="adminCodeInput" type="text" oninput="updateAdminCode(this.value)"
                class="w-full mt-1 mb-4 bg-gray-800 border border-gray-700 rounded-lg p-2 focus:outline-none focus:border-blue-500" />

              <label class="text-sm text-gray-400">Add one organisation</label>
              <div class="flex gap-2 mt-1 mb-4">
                <input id="singleOrganisation" type="text" placeholder="e.g. Company A"
                  class="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2 focus:outline-none focus:border-green-500" />
                <button onclick="addSingleOrganisation()" class="bg-green-600 hover:bg-green-700 px-4 rounded-lg font-semibold">Add</button>
              </div>

              <label class="text-sm text-gray-400">Paste list</label>
              <textarea id="bulkOrganisations" rows="4" placeholder="Company A&#10;Company B"
                class="w-full mt-1 bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-green-500"></textarea>
              <button onclick="addBulkOrganisations()" class="w-full mt-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 p-2 rounded-lg text-sm">Add All</button>

              <div class="mt-4">
                <label class="text-sm text-gray-400 block mb-1">Upload TXT/CSV</label>
                <input type="file" accept=".txt,.csv" onchange="handleOrganisationFile(event)"
                  class="w-full text-sm text-gray-400 file:bg-green-600 file:text-white file:border-0 file:rounded-lg file:px-3 file:py-2 file:mr-3 hover:file:bg-green-700" />
              </div>

              <div class="mt-5">
                <div class="flex items-center justify-between mb-2">
                  <h3 class="font-semibold text-sm text-gray-300">List</h3>
                  <button onclick="clearAllOrganisations()" class="text-xs text-red-400 hover:text-red-300">Clear</button>
                </div>
                <div id="organisationList" class="max-h-64 overflow-y-auto custom-scroll space-y-2 pr-1"></div>
              </div>
            </section>

            <section class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
              <h2 class="text-xl font-bold text-purple-400 mb-4">Games</h2>
              <label class="text-sm text-gray-400">Choose game</label>
              <select id="gameSelect" onchange="selectGame(this.value)"
                class="w-full mt-1 bg-gray-800 border border-gray-700 rounded-lg p-2 focus:outline-none focus:border-purple-500"></select>

              <div class="mt-4">
                <label class="text-sm text-gray-400">Add game</label>
                <div class="flex gap-2 mt-1">
                  <input id="newGameName" type="text" placeholder="e.g. Netball"
                    class="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2 focus:outline-none focus:border-purple-500" />
                  <button onclick="addGame()" class="bg-purple-600 hover:bg-purple-700 px-4 rounded-lg font-semibold">Add</button>
                </div>
              </div>
              <button onclick="deleteSelectedGame()" class="w-full mt-4 bg-red-950 hover:bg-red-900 border border-red-900 text-red-300 p-2 rounded-lg text-sm">Delete Game</button>
            </section>
          </aside>

          <main class="xl:col-span-3 space-y-6">
            <section class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
              <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                <div>
                  <p class="text-sm text-gray-400">Selected Game</p>
                  <h2 id="selectedGameTitle" class="text-3xl font-black text-white"></h2>
                  <p id="gameStatus" class="text-sm text-gray-400 mt-1"></p>
                </div>
                <div class="flex flex-col sm:flex-row gap-3">
                  <div>
                    <label class="text-xs text-gray-400">Format</label>
                    <select id="formatSelect" onchange="changeFormat(this.value)"
                      class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 focus:outline-none focus:border-blue-500">
                      <option value="knockout">Knockout</option>
                      <option value="roundRobin">Round Robin</option>
                      <option value="groupStage">Group Stage</option>
                    </select>
                  </div>
                  <div class="flex items-end">
                    <button onclick="runRandomSeedDraw()"
                      class="w-full sm:w-auto bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 px-8 py-3 rounded-xl font-black shadow-lg">
                      🎲 Draw
                    </button>
                  </div>
                </div>
              </div>

              <div class="mt-6 border-t border-gray-800 pt-5">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-3">
                  <h3 class="text-lg font-bold text-blue-400">Participants</h3>
                  <div class="flex gap-2">
                    <button onclick="selectAllParticipants()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-3 py-2 rounded-lg text-sm">All</button>
                    <button onclick="clearParticipants()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-3 py-2 rounded-lg text-sm">Clear</button>
                  </div>
                </div>
                <div class="mb-3 text-sm text-gray-400">Selected: <span id="participantCount" class="font-bold text-white">0</span></div>
                <div id="participantsList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 max-h-72 overflow-y-auto custom-scroll pr-1"></div>
              </div>
            </section>

            <section id="groupAssignmentSection" class="hidden bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-black text-purple-400">Manual Group Assignment</h2>
                <button onclick="addNewGroup()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-semibold">+ Add Group</button>
              </div>
              <p class="text-sm text-gray-400 mb-4">Assign teams to groups manually. Click the arrow buttons to move teams between groups.</p>
              <div id="groupAssignmentArea" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </section>
          </main>
        </div>
      </div>

      <section class="grid grid-cols-1 2xl:grid-cols-5 gap-6 mt-6">
        <div class="2xl:col-span-2 bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-2xl font-black text-green-400">Seeds</h2>
            <button id="clearResultsBtn" onclick="clearAllResults()" class="hidden no-print bg-red-950 hover:bg-red-900 border border-red-900 text-red-300 px-3 py-1 rounded-lg text-xs">Clear Results</button>
          </div>
          <div id="seedsArea"></div>
        </div>

        <div class="2xl:col-span-3 bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
          <h2 class="text-2xl font-black text-blue-400 mb-4">Fixtures</h2>
          <div id="fixturesArea"></div>
        </div>
      </section>

      <section id="standingsSection" class="hidden mt-6 bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
        <h2 class="text-2xl font-black text-amber-400 mb-4">Standings</h2>
        <div id="standingsArea"></div>
      </section>
    </div>

  </div>

  <script src="utils.js"></script>
  <script src="fixtures.js"></script>
  <script src="app.js"></script>
  <script src="dashboard.js"></script>
  <script src="game-view.js"></script>
</body>
</html>
